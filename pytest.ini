# WHY THIS FILE EXISTS. Running `python3 -m pytest` from the repository root does not run this project's test
# suite - it dies during COLLECTION, before a single test executes:
#
#     ERROR collecting scripts/40c_wide_panel_test.py
#     NPERM = int(sys.argv[1]) if len(sys.argv) > 1 else 2000
#     ValueError: invalid literal for int() with base 10: '-q'
#
# Five analysis scripts are named for what they test rather than for pytest - 09_phylo_test.py,
# 33b_ortholog_test.py, 34b_structure_exposure_test.py, 36b_structure_panel_test.py, 40c_wide_panel_test.py - and
# every one of them matches pytest's default `*_test.py` collection pattern. pytest imports each at collection
# time, each reads sys.argv, and the first one parses pytest's own `-q` as its permutation count and raises.
# The suite was therefore only ever runnable as `pytest tests/`, which is how it has been run, and the obvious
# invocation produced a 19-minute collection error that looks like a failing project and is not one.
# THE FIX IS CONFIGURATION, NOT RENAMING. Those five names are cited in docs/SYNTHESIS.md section 9 and in the
# README log, so renaming them to satisfy a test runner would invalidate citations across four documents to make
# a tool happy. Restricting collection to tests/ and to the `test_*.py` prefix costs nothing and makes the plain
# command correct.
[pytest]
testpaths = tests
python_files = test_*.py
